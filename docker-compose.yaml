
services:
  # Next.js Frontend Service (Development mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: nextjs-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network
    command: npm run dev

  # Nginx Service for serving Next.js production build
  nginx:
    image: nginx:alpine
    container_name: nginx-frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend-build
      - backend
    networks:
      - app-network
    profiles:
      - production

  # Next.js Frontend Production Build Service
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: nextjs-build
    networks:
      - app-network
    profiles:
      - production

  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: post_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=modelTracking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express TypeScript Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express-backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/modelTracking
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=modelTracking
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    command: npm run dev

networks:
  app-network:
    driver: bridge

volumes:
  node_modules_frontend:
  node_modules_backend:
  postgres_data:

